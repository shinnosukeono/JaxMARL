# R2D2-OP (Other-Play) on Hanabi.
# Same as r2d2_publ_rnn_hanabi but with per-episode color permutation
# (shuffle_color=1 in the original R3D2 C++ implementation).

"TOTAL_TIMESTEPS": 5e8
"NUM_ENVS": 256
"NUM_STEPS": 80
"BUFFER_SIZE": 50000
"BUFFER_BATCH_SIZE": 96

"HIDDEN_SIZE": 512
"EPS_START": 0.1
"EPS_FINISH": 0.001
"EPS_DECAY": 0.1
"MAX_GRAD_NORM": 5.0
"TARGET_UPDATE_INTERVAL": 2500
"TAU": 1.0
"NUM_EPOCHS": 41
"LR": 6.25e-5
"ADAM_EPS": 1.5e-5
"LR_LINEAR_DECAY": False
"LEARNING_STARTS": 10000
"GAMMA": 0.999
"MULTI_STEP": 1
"REW_SCALE": 1.0

# Other-Play: enable per-episode color permutation
"OTHER_PLAY": True

# ENV
"ENV_NAME": "hanabi"
"ENV_KWARGS": {
  "num_agents": 2,
}

# evaluate (greedy eval uses standard colors, no OP)
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.01
"TEST_NUM_STEPS": 80
"TEST_NUM_ENVS": 256

"ALG_NAME": "r2d2_op_rnn_hanabi"
