# R2D2 (public/private LSTM) on Hanabi.
# Matches the iql.yaml from the original R3D2 repo (chandar-lab):
#   net=publ-lstm, rnn_hid_dim=512, num_lstm_layer=2, batchsize=96,
#   replay_buffer_size=50000, num_epoch=2000, epoch_len=500.
#
# The original produces 2000 × 500 = 1,000,000 gradient steps.
# In our synchronous loop: NUM_UPDATES = TOTAL_TIMESTEPS / NUM_STEPS / NUM_ENVS.
# With TOTAL_TIMESTEPS=5e8, NUM_STEPS=80, NUM_ENVS=256 → ~24,414 updates.
# NUM_EPOCHS=41 gives 24,414 × 41 ≈ 1,001,000 gradient steps.

"TOTAL_TIMESTEPS": 5e8
"NUM_ENVS": 256
"NUM_STEPS": 80
"BUFFER_SIZE": 50000
"BUFFER_BATCH_SIZE": 96

"HIDDEN_SIZE": 512
"EPS_START": 0.1
"EPS_FINISH": 0.001
"EPS_DECAY": 0.1
"MAX_GRAD_NORM": 5.0
"TARGET_UPDATE_INTERVAL": 2500
"TAU": 1.0
"NUM_EPOCHS": 41
"LR": 6.25e-5
"ADAM_EPS": 1.5e-5
"LR_LINEAR_DECAY": False
"LEARNING_STARTS": 10000
"GAMMA": 0.999
"MULTI_STEP": 1
"REW_SCALE": 1.0

# ENV
"ENV_NAME": "hanabi"
"ENV_KWARGS": {
  "num_agents": 2,
}

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.01
"TEST_NUM_STEPS": 80
"TEST_NUM_ENVS": 256

"ALG_NAME": "r2d2_publ_rnn_hanabi"
