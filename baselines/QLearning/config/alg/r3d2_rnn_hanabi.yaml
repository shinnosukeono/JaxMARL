# R3D2 (DRRN-style text-action Q-learning) on Hanabi.
# Matches r3d2.yaml from the original R3D2 repo (chandar-lab):
#   net=drrn-lstm, rnn_hid_dim=128, num_lm_layer=1 (1 BERT encoder layer),
#   batchsize=64, replay_buffer_size=50000, lm_weights=pretrained.
#
# Original: 2000 epochs × 500 epoch_len = 1,000,000 gradient steps.
# Our loop: NUM_UPDATES = 5e8 / 80 / 256 = 24,414.
# NUM_EPOCHS=41 → 24,414 × 41 ≈ 1,001,000 gradient steps.

"TOTAL_TIMESTEPS": 5e8
"NUM_ENVS": 256
"NUM_STEPS": 80
"BUFFER_SIZE": 50000
"BUFFER_BATCH_SIZE": 64

"HIDDEN_SIZE": 128
"EPS_START": 0.1
"EPS_FINISH": 0.001
"EPS_DECAY": 0.1
"MAX_GRAD_NORM": 5.0
"TARGET_UPDATE_INTERVAL": 2500
"TAU": 1.0
"NUM_EPOCHS": 41
"LR": 6.25e-5
"ADAM_EPS": 1.5e-5
"LR_LINEAR_DECAY": False
"LEARNING_STARTS": 10000
"GAMMA": 0.999
"MULTI_STEP": 1
"REW_SCALE": 1.0

# text encoders (1-layer TinyBERT, matching original's num_lm_layer=1)
"BERT_MODEL_DIR": "baselines/QLearning/pretrained_text/tinybert_l2_flax"
"MAX_OBS_TOKENS": 256
"MAX_ACTION_TOKENS": 12
"INCLUDE_BELIEF": False

# ENV
"ENV_NAME": "hanabi"
"ENV_KWARGS": {
  "num_agents": 2,
}

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.01
"TEST_NUM_STEPS": 80
"TEST_NUM_ENVS": 64

"ALG_NAME": "r3d2_rnn_hanabi"
